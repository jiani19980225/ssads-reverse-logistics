[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse_logistics_s2s"
version = "0.2.0"
description = "Semantic Signal-Assisted Decision Support for Reverse Logistics"
authors = [
    {name = "Jiani He"},
    {name = "Dingyan Shang"},
    {name = "Yihua Xu"},
    {name = "Shiqi Huang"},
    {name = "Yan Lyu"},
    {name = "Jize Li"},
    {name = "Shangjing Tang"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.16",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
llm = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["experiments"]
include = ["src*"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
